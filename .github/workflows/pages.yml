name: Build GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "tools/qr-code/index.html"
      - "tools/qr-code/404.html"
      - "tools/qr-code/assets/**"
      - "tools/qr-code/.nojekyll"
      - "tools/qr-code/favicon.svg"
      - "tools/image-studio/index.html"
      - "tools/image-studio/404.html"
      - "tools/image-studio/assets/**"
      - "tools/image-studio/.nojekyll"
      - "tools/image-studio/favicon.svg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            tools/qr-code/pnpm-lock.yaml
            tools/image-studio/pnpm-lock.yaml
      - name: Validate static site
        run: |
          node --check chat.js
          node --check global-shortcuts.js
          node --check register-sw.js
          node --check sw.js
          node --check tools/pdf-studio/pdf-studio.js
          node scripts/check-site.mjs
      - name: Build QR tool
        working-directory: tools/qr-code
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build:pages
      - name: Build Image Studio
        working-directory: tools/image-studio
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:pages
      - name: Commit Pages files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/qr-code/index.html tools/qr-code/404.html tools/qr-code/.nojekyll tools/qr-code/favicon.svg tools/qr-code/assets
          git add tools/image-studio/index.html tools/image-studio/404.html tools/image-studio/.nojekyll tools/image-studio/favicon.svg tools/image-studio/assets
          if git diff --staged --quiet; then
            echo "No Pages file changes"
          else
            git commit -m "Update GitHub Pages tool builds [skip ci]"
            git push
          fi
